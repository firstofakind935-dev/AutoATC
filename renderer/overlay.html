<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AutoATC Overlay</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }
  #hud {
    position: fixed;
    inset: 0;
  }
  #banner {
    position: fixed;
    top: 14px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(37, 99, 235, 0.92);
    color: #fff;
    padding: 7px 16px;
    border-radius: 6px;
    font: 13px -apple-system, "Segoe UI", sans-serif;
    display: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }
</style>
</head>
<body>
  <div id="banner"></div>
  <canvas id="hud"></canvas>
  <script src="overlay.js"></script>
</body>
</html>
