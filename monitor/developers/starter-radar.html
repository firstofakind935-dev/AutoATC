<!doctype html>
<!--
  AutoATC starter radar - a single, dependency-free HTML file you can copy,
  host anywhere (or just open locally) and build your own radar on.

  Data comes from AutoATC's public API (see /developers on the monitor
  service): GET {API_BASE}/api/public/v1/traffic every few seconds. There's
  no map - every aircraft's position is a distance and bearing from a
  reference airport, so this draws a classic radar scope centred on one
  airport and plots the traffic around it.

  Things to make your own: colors (the :root tokens), the label block in
  drawAircraft(), range rings, trail length, or draw your own map underneath
  in draw().
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Starter Radar</title>
<style>
  :root {
    --bg: #05080d;
    --scope: #08111b;
    --ring: #17324a;
    --text: #cfe3d6;
    --dim: #6f8a7d;
    --target: #6dff9c;
    --vector: #ffbf47;
    --ident: #ff6b6b;
    --airport: #7aa7ff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font: 12px/1.3 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: none; }
  #hud { position: fixed; top: 8px; left: 8px; right: 8px; display: flex; gap: 8px; flex-wrap: wrap;
    align-items: center; pointer-events: none; }
  #hud > * { pointer-events: auto; background: rgba(5, 8, 13, 0.85); border: 1px solid #1d2a38;
    padding: 4px 8px; border-radius: 4px; color: var(--text); font: inherit; }
  #status.err { color: var(--ident); }
  label { display: inline-flex; gap: 4px; align-items: center; }
</style>
</head>
<body>
<canvas id="scope"></canvas>
<div id="hud">
  <select id="airport" title="Airport the scope is centred on"></select>
  <span id="range"></span>
  <label><input type="checkbox" id="show-trails" checked> trails</label>
  <span id="status">connecting…</span>
</div>
<script>
// Where to pull data from. Leave the placeholder to use the same origin
// this page is served from, or pass ?api=https://your-monitor.example in
// the URL to point it anywhere at runtime.
const API_BASE_DEFAULT = '__AUTOATC_API_BASE__';
const API_BASE = (new URLSearchParams(location.search).get('api')
  || (API_BASE_DEFAULT.startsWith('__') ? location.origin : API_BASE_DEFAULT)).replace(/\/$/, '');

const POLL_MS = 3000;
const TRAIL_POINTS = 20;
const LEADER_MINUTES = 1; // heading leader line = where the aircraft will be in this many minutes
const VECTOR_NM = 5;
const RANGES_NM = [5, 10, 20, 40, 80, 160];

const canvas = document.getElementById('scope');
const ctx = canvas.getContext('2d');
const statusEl = document.getElementById('status');
const airportSelect = document.getElementById('airport');
const rangeEl = document.getElementById('range');
const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();

let aircraft = [];
let rangeIndex = 2;
const trails = new Map(); // callsign -> [{distanceNm, bearingDeg}], oldest first

// Polar (distance/bearing from the scope's airport) -> x/y in nautical
// miles, east and north positive.
function polarToNm(distanceNm, bearingDeg) {
  const rad = (bearingDeg * Math.PI) / 180;
  return { x: distanceNm * Math.sin(rad), y: distanceNm * Math.cos(rad) };
}

// A point `nm` further along `headingDeg` from `p` (both in nm).
function project(p, headingDeg, nm) {
  const rad = (headingDeg * Math.PI) / 180;
  return { x: p.x + nm * Math.sin(rad), y: p.y + nm * Math.cos(rad) };
}

function scopeGeometry() {
  const w = canvas.clientWidth, h = canvas.clientHeight;
  const radiusPx = Math.min(w, h - 40) / 2 - 24; // leave room for the HUD and bearing labels
  return { cx: w / 2, cy: 40 + (h - 40) / 2, pxPerNm: radiusPx / RANGES_NM[rangeIndex], radiusPx };
}

function toScreen(p, g) {
  return { x: g.cx + p.x * g.pxPerNm, y: g.cy - p.y * g.pxPerNm };
}

async function pollTraffic() {
  try {
    const res = await fetch(`${API_BASE}/api/public/v1/traffic`);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    aircraft = data.aircraft.filter((a) => a.referenceAirport && a.distanceNm !== null && a.bearingDeg !== null);
    updateAirportList();
    const seen = new Set();
    for (const a of aircraft) {
      seen.add(a.callsign);
      const trail = trails.get(a.callsign) || [];
      const last = trail[trail.length - 1];
      if (!last || last.distanceNm !== a.distanceNm || last.bearingDeg !== a.bearingDeg || last.airport !== a.referenceAirport) {
        trail.push({ airport: a.referenceAirport, distanceNm: a.distanceNm, bearingDeg: a.bearingDeg });
      }
      if (trail.length > TRAIL_POINTS) trail.shift();
      trails.set(a.callsign, trail);
    }
    for (const callsign of trails.keys()) if (!seen.has(callsign)) trails.delete(callsign);
    statusEl.textContent = `${aircraft.length} aircraft · ${new Date(data.generatedAt).toLocaleTimeString()}`;
    statusEl.className = '';
  } catch (err) {
    statusEl.textContent = `could not reach ${API_BASE}: ${err.message}`;
    statusEl.className = 'err';
  }
  draw();
}

// The airport list comes from the traffic itself - every airport some
// aircraft is currently positioned relative to, busiest first.
function updateAirportList() {
  const counts = new Map();
  for (const a of aircraft) counts.set(a.referenceAirport, (counts.get(a.referenceAirport) || 0) + 1);
  const current = airportSelect.value || new URLSearchParams(location.search).get('airport');
  const icaos = [...counts.keys()].sort((x, y) => counts.get(y) - counts.get(x) || x.localeCompare(y));
  if (current && !counts.has(current)) icaos.push(current);
  airportSelect.innerHTML = '';
  if (!icaos.length) airportSelect.add(new Option('no traffic', ''));
  for (const icao of icaos) airportSelect.add(new Option(`${icao} (${counts.get(icao) || 0})`, icao));
  if (icaos.length) airportSelect.value = current && icaos.includes(current) ? current : icaos[0];
}

function line(a, b, g, color, dash = []) {
  const s = toScreen(a, g), e = toScreen(b, g);
  ctx.strokeStyle = color;
  ctx.setLineDash(dash);
  ctx.beginPath(); ctx.moveTo(s.x, s.y); ctx.lineTo(e.x, e.y); ctx.stroke();
  ctx.setLineDash([]);
}

function drawScope(g) {
  const range = RANGES_NM[rangeIndex];
  ctx.strokeStyle = css('--ring');
  ctx.fillStyle = css('--dim');
  ctx.font = '11px ui-monospace, Menlo, Consolas, monospace';
  for (let i = 1; i <= 4; i++) {
    const nm = (range / 4) * i;
    ctx.beginPath(); ctx.arc(g.cx, g.cy, nm * g.pxPerNm, 0, Math.PI * 2); ctx.stroke();
    const at = toScreen(polarToNm(nm, 15), g); // between the 000 and 030 spokes
    ctx.fillText(`${nm}`, at.x + 3, at.y - 3);
  }
  for (let deg = 0; deg < 360; deg += 30) {
    const edge = toScreen(polarToNm(range, deg), g);
    ctx.beginPath(); ctx.moveTo(g.cx, g.cy); ctx.lineTo(edge.x, edge.y); ctx.stroke();
    const label = toScreen(polarToNm(range * 1.04, deg), g);
    ctx.fillText(String(deg).padStart(3, '0'), label.x - 10, label.y + 4);
  }
  ctx.fillStyle = css('--airport');
  ctx.beginPath(); ctx.arc(g.cx, g.cy, 3, 0, Math.PI * 2); ctx.fill();
  ctx.fillText(airportSelect.value, g.cx + 6, g.cy + 14);
}

function drawAircraft(a, g) {
  const color = a.identing ? css('--ident') : css('--target');
  const p = polarToNm(a.distanceNm, a.bearingDeg);
  if (document.getElementById('show-trails').checked) {
    ctx.fillStyle = css('--dim');
    for (const t of (trails.get(a.callsign) || []).slice(0, -1)) {
      if (t.airport !== a.referenceAirport) continue;
      const s = toScreen(polarToNm(t.distanceNm, t.bearingDeg), g);
      ctx.fillRect(s.x - 1, s.y - 1, 2, 2);
    }
  }
  if (a.headingDeg !== null && a.speedKt) line(p, project(p, a.headingDeg, (a.speedKt / 60) * LEADER_MINUTES), g, color);
  if (a.assignedHeadingDeg !== null) line(p, project(p, a.assignedHeadingDeg, VECTOR_NM), g, css('--vector'), [4, 3]);

  const s = toScreen(p, g);
  ctx.strokeStyle = color;
  ctx.lineWidth = 1.5;
  ctx.strokeRect(s.x - 4, s.y - 4, 8, 8);
  ctx.lineWidth = 1;

  // Classic three-line data block: callsign / altitude (hundreds) + speed (tens) / type
  const alt = a.altitudeFt === null ? '---' : String(Math.round(a.altitudeFt / 100)).padStart(3, '0');
  const spd = a.speedKt === null ? '--' : Math.round(a.speedKt / 10);
  ctx.fillStyle = color;
  ctx.font = '12px ui-monospace, Menlo, Consolas, monospace';
  ctx.fillText(a.callsign, s.x + 10, s.y - 10);
  ctx.fillText(`${alt} ${spd}`, s.x + 10, s.y + 3);
  ctx.fillStyle = css('--dim');
  ctx.fillText(a.aircraftType || '', s.x + 10, s.y + 16);
}

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const w = canvas.clientWidth, h = canvas.clientHeight;
  if (canvas.width !== w * dpr || canvas.height !== h * dpr) { canvas.width = w * dpr; canvas.height = h * dpr; }
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = css('--bg');
  ctx.fillRect(0, 0, w, h);
  const g = scopeGeometry();
  ctx.fillStyle = css('--scope');
  ctx.beginPath(); ctx.arc(g.cx, g.cy, g.radiusPx, 0, Math.PI * 2); ctx.fill();
  rangeEl.textContent = `range ${RANGES_NM[rangeIndex]} nm`;
  if (!airportSelect.value) return;
  drawScope(g);
  for (const a of aircraft) if (a.referenceAirport === airportSelect.value) drawAircraft(a, g);
}

// Scroll to change range
canvas.addEventListener('wheel', (e) => {
  e.preventDefault();
  rangeIndex = Math.max(0, Math.min(RANGES_NM.length - 1, rangeIndex + Math.sign(e.deltaY)));
  draw();
}, { passive: false });
airportSelect.addEventListener('change', draw);
document.getElementById('show-trails').addEventListener('change', draw);
window.addEventListener('resize', draw);

pollTraffic();
setInterval(pollTraffic, POLL_MS);
</script>
</body>
</html>
