<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Application Review</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="/apply/static/style.css">
</head>
<body>
<div class="wrap wide">
  <header style="display:grid;gap:8px">
    <span class="eyebrow">AutoATC · Halloween event · reviewers only</span>
    <h1>Application Review</h1>
  </header>

  <div id="flash" class="banner warn" hidden></div>
  <section id="signin" class="card" hidden>
    <p id="signinText">Sign in with Discord to review applications.</p>
    <div class="actions"><a class="btn discord" href="/apply/login?next=review">Sign in with Discord</a></div>
  </section>

  <section id="summary" class="card" hidden>
    <div class="toolbar">
      <div class="chips" id="statusChips"></div>
      <input type="text" id="search" placeholder="Search name or Roblox user" aria-label="Search applications">
      <select id="sort" aria-label="Sort applications">
        <option value="submitted">Oldest first</option>
        <option value="newest">Newest first</option>
        <option value="tenure">Longest in first server</option>
      </select>
    </div>
    <details>
      <summary>Position demand (1st / 2nd / 3rd picks)</summary>
      <div class="table-wrap"><table class="tally" id="tally"></table></div>
    </details>
  </section>

  <section id="rosterCard" class="card" hidden>
    <div class="toolbar" style="justify-content:space-between">
      <h2>Roster</h2>
      <div class="actions">
        <button type="button" id="copyDiscord">Copy for Discord</button>
        <a class="btn" href="/apply/api/admin/export.csv">Download CSV</a>
        <button type="button" id="publish" class="primary">Publish roster</button>
      </div>
    </div>
    <p class="hint" id="rosterHint"></p>
    <div class="table-wrap"><table class="tally" id="roster"></table></div>
    <div id="discordBox" class="q" hidden>
      <label for="discordText">Paste this into Discord. Each line pings that controller.</label>
      <textarea id="discordText" rows="12" spellcheck="false" style="font-family:var(--mono);font-size:13px"></textarea>
      <span class="note" id="copyNote" role="status"></span>
    </div>
  </section>

  <div class="apps" id="apps"></div>
</div>
<script src="/apply/static/review.js"></script>
</body>
</html>
