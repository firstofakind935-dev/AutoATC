<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>AutoATC Overlay</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    overflow: hidden;
    width: 100%;
    height: 100%;
    font: 13px -apple-system, "Segoe UI", sans-serif;
    color: #e6ebf5;
  }
  #hud {
    position: fixed;
    inset: 0;
  }
  #banner {
    position: fixed;
    top: 54px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(37, 99, 235, 0.92);
    color: #fff;
    padding: 7px 16px;
    border-radius: 6px;
    display: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
  }

  /* The top bar container is now fully invisible and never itself
     intercepts the cursor (pointer-events: none) - only the 3 buttons
     inside .bar-actions are visible and clickable (they carry
     ".overlay-ui" individually, not this container - see overlay.js's
     hit-test). The brand/status elements stay in the DOM so overlay.js's
     existing element lookups don't break, but are hidden; their data
     still drives the Messages button's unread badge and the tracking
     button's label/state. */
  #topbar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    height: 40px;
    background: transparent;
    display: flex;
    align-items: center;
    justify-content: flex-end;
    padding: 0 14px;
    gap: 18px;
    pointer-events: none;
    -webkit-app-region: no-drag;
  }
  .bar-brand, .bar-status { display: none; }
  .bar-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
    pointer-events: auto;
  }
  .bar-actions button {
    background: rgba(56, 189, 248, 0.12);
    border: 1px solid rgba(56, 189, 248, 0.4);
    color: #e6ebf5;
    border-radius: 6px;
    padding: 5px 11px;
    font-size: 0.85em;
    cursor: pointer;
    font-family: inherit;
  }
  .bar-actions button:hover { background: rgba(56, 189, 248, 0.25); }
  .bar-actions button.armed {
    background: rgba(248, 113, 113, 0.18);
    border-color: rgba(248, 113, 113, 0.5);
  }

  /* Messages badge button, positioned like any other bar action */
  #barMessagesBtn { position: relative; }
  #messagesBadge {
    position: absolute;
    top: -5px;
    right: -5px;
    background: #f87171;
    color: #2a0a0a;
    font-size: 0.68em;
    font-weight: 700;
    border-radius: 999px;
    min-width: 16px;
    height: 16px;
    line-height: 16px;
    text-align: center;
    padding: 0 3px;
  }

  /* Dropdown panel of received CPDLC/PDC messages, opened from the bar. */
  #messagePanel {
    position: fixed;
    top: 44px;
    right: 14px;
    width: 320px;
    max-height: 360px;
    overflow-y: auto;
    background: rgba(11, 18, 32, 0.95);
    border: 1px solid rgba(56, 189, 248, 0.35);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    padding: 8px;
  }
  .message-empty { color: #8ea0c0; padding: 10px; text-align: center; font-size: 0.9em; }
  .message-item {
    border-bottom: 1px solid rgba(56, 189, 248, 0.15);
    padding: 8px 6px;
  }
  .message-item:last-child { border-bottom: none; }
  .message-meta { color: #8ea0c0; font-size: 0.72em; margin-bottom: 3px; }
  .message-body { line-height: 1.4; }
  .message-item.message-broadcast { border-left: 3px solid #38bdf8; padding-left: 9px; }

  /* Radio/transponder panel, opened from the bar the same way the message
     panel is - see overlay.js's toggleRadioPanel(). */
  #radioPanel {
    position: fixed;
    top: 44px;
    right: 14px;
    width: 300px;
    max-height: 480px;
    overflow-y: auto;
    background: rgba(11, 18, 32, 0.95);
    border: 1px solid rgba(56, 189, 248, 0.35);
    border-radius: 8px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
    padding: 10px;
  }
  .radio-row {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 4px;
    border-bottom: 1px solid rgba(56, 189, 248, 0.15);
  }
  .radio-row:last-child { border-bottom: none; }
  .radio-info { flex: 1; min-width: 0; }
  .radio-label {
    font-size: 0.68em;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: #8ea0c0;
  }
  .radio-freqs { display: flex; align-items: baseline; gap: 6px; margin-top: 2px; }
  .radio-active { font-size: 1.05em; font-weight: 700; color: #38bdf8; }
  .radio-standby { font-size: 0.92em; color: #b9c6dc; }
  .radio-swap {
    background: rgba(56, 189, 248, 0.12);
    border: 1px solid rgba(56, 189, 248, 0.4);
    color: #e6ebf5;
    border-radius: 5px;
    width: 26px;
    height: 26px;
    cursor: pointer;
    font-size: 0.9em;
  }
  .radio-swap:disabled { opacity: 0.35; cursor: not-allowed; }
  .radio-power {
    background: transparent;
    border: 1px solid rgba(56, 189, 248, 0.4);
    color: #b9c6dc;
    border-radius: 5px;
    padding: 2px 6px;
    font-size: 0.68em;
    cursor: pointer;
    margin-top: 4px;
  }

  /* The knob: a small draggable/scrollable dial. Turning it steps the
     standby frequency (or squawk digit) - the rotation itself is purely a
     tactile cue (accumulates per step, wraps at 360°), not a literal
     mapping of the underlying value's range. See overlay.js's makeKnob(). */
  .knob {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 30%, #2a3a56, #0e1626);
    border: 1px solid rgba(56, 189, 248, 0.5);
    position: relative;
    cursor: grab;
    flex-shrink: 0;
    touch-action: none;
  }
  .knob:active { cursor: grabbing; }
  .knob-indicator {
    position: absolute;
    top: 3px;
    left: 50%;
    width: 2px;
    height: 11px;
    background: #38bdf8;
    transform-origin: 1px 14px;
    margin-left: -1px;
  }

  /* Toast for a newly-arrived message - separate from #banner, which is
     reserved for setup/calibration prompts. Broadcasts (fleet-wide, not
     addressed to this pilot specifically) get a distinct color from a
     targeted contact/PDC message. */
  #toast {
    position: fixed;
    top: 54px;
    left: 50%;
    transform: translateX(-50%);
    max-width: 480px;
    background: rgba(251, 191, 36, 0.95);
    color: #1a1200;
    padding: 8px 16px;
    border-radius: 6px;
    display: none;
    box-shadow: 0 2px 8px rgba(0,0,0,0.3);
    font-weight: 600;
  }
  #toast.broadcast {
    background: rgba(56, 189, 248, 0.95);
    color: #04121c;
  }
</style>
</head>
<body>
  <canvas id="hud"></canvas>

  <div id="topbar">
    <div class="bar-brand">
      <span class="bar-mark">ATC</span>
      <span>AutoATC</span>
    </div>
    <div class="bar-status">
      <span class="bar-dot" id="barDotFix"></span><span id="barFixText">No fix</span>
      <span class="bar-sep">|</span>
      <span class="bar-dot" id="barDotTracking"></span><span id="barTrackingText">Stopped</span>
    </div>
    <div class="bar-actions">
      <button id="barMessagesBtn" class="overlay-ui">Messages<span id="messagesBadge" hidden></span></button>
      <button id="barRadiosBtn" class="overlay-ui">Radios</button>
      <button id="barToggleTrackingBtn" class="overlay-ui">Start tracking</button>
      <button id="barSetupBtn" class="overlay-ui">Setup</button>
    </div>
  </div>

  <div id="messagePanel" class="overlay-ui" hidden>
    <div id="messageList"></div>
  </div>

  <div id="radioPanel" class="overlay-ui" hidden>
    <div id="radioList"></div>
  </div>

  <div id="banner"></div>
  <div id="toast"></div>
  <script src="overlay.js"></script>
</body>
</html>
